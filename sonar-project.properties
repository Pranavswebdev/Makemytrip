# Generated by Hybrid POD from the SonarQube integration config.
# Edit the values in Hybrid POD > Manage Integrations > SonarQube — changes here will be overwritten.
sonar.projectKey=Makmytrip
sonar.host.url=https://codequality.ccstechnologies.org
sonar.sources=src
sonar.exclusions=node_modules/**,dist/**,coverage/**,.devmind/**
sonar.login=25b4b32065c3c337e0725f6edab1fbf023b991ec
sonar.qualitygate.wait=true
# Default multi-language coverage paths — SonarQube ignores any that don't exist on disk.
# JS / TS — Vitest, Jest. Requires `lcov` in your coverage reporter list (it is NOT a vitest default).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
# Python — pytest-cov + coverage.xml
sonar.python.coverage.reportPaths=coverage.xml
# Java — Jacoco XML report (Maven: target/site/jacoco/jacoco.xml; Gradle: build/reports/jacoco/test/jacocoTestReport.xml)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,build/reports/jacoco/test/jacocoTestReport.xml
# Go — go test -coverprofile=coverage.out
sonar.go.coverage.reportPaths=coverage.out
# C# — Coverlet OpenCover
sonar.cs.opencover.reportsPaths=coverage.opencover.xml,**/coverage.opencover.xml
# Generic XML test execution report fallback
sonar.testExecutionReportPaths=test-results/sonar-execution.xml
